# Tema escuro do painel web, na mesma paleta da tela de 3,5".
Hub:
  # superficies
  primary-background-color: "#0B0D12"
  secondary-background-color: "#12151D"
  lovelace-background: "radial-gradient(1200px 700px at 50% -10%, #1B2452 0%, #0B0D12 60%)"
  card-background-color: "#161A24"
  ha-card-background: "#161A24"
  ha-card-border-color: "#232838"
  ha-card-border-width: "1px"
  ha-card-border-radius: "18px"
  ha-card-box-shadow: "0 8px 24px rgba(0, 0, 0, 0.35)"
  divider-color: "#232838"
  # texto
  primary-text-color: "#ECEFF5"
  secondary-text-color: "#8088A0"
  text-primary-color: "#ECEFF5"
  disabled-text-color: "#566078"
  # marca
  primary-color: "#6C7BE0"
  accent-color: "#FFB020"
  dark-primary-color: "#4F5A94"
  light-primary-color: "#9AA6F2"
  # barra superior e lateral
  app-header-background-color: "#0B0D12"
  app-header-text-color: "#ECEFF5"
  app-header-border-bottom: "1px solid #232838"
  sidebar-background-color: "#0E1118"
  sidebar-text-color: "#B4BBD0"
  sidebar-icon-color: "#8088A0"
  sidebar-selected-text-color: "#9AA6F2"
  sidebar-selected-icon-color: "#9AA6F2"
  # estados
  state-icon-color: "#8088A0"
  state-switch-on-color: "#FFB020"
  state-light-on-color: "#FFB020"
  state-climate-cool-color: "#40C4FF"
  state-climate-auto-color: "#40D680"
  state-climate-dry-color: "#FFB020"
  state-climate-fan_only-color: "#9AA6F2"
  state-climate-heat-color: "#FF6A00"
  state-media_player-on-color: "#40D680"
  state-media_player-playing-color: "#40D680"
  # controles
  ha-tile-border-radius: "18px"
  switch-checked-color: "#FFB020"
  switch-unchecked-button-color: "#566078"
  switch-unchecked-track-color: "#232838"
  input-fill-color: "#12151D"
  mdc-theme-primary: "#6C7BE0"
  mdc-theme-surface: "#161A24"
  # tipografia dos titulos de secao
  ha-heading-card-title-font-size: "20px"
  ha-heading-card-title-font-weight: "600"
